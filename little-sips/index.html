<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little sips</title>
<meta name="apple-mobile-web-app-title" content="Little sips">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E6F1FF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151C3A" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E6F1FF;
    --halo: #F7FBFF;
    --ink: #27335F;
    --ink-soft: #5F6C9E;
    --shadow: #27335F;
    --water: #6BBEF8;
    --water-deep: #3F97E8;
    --pink: #FF8FB3;
    --butter: #FFDF8A;
    --glass: #FFFFFF;
    --gloss: rgba(255, 255, 255, .6);
    --card: #FFFFFF;
    --field: #EEF5FF;
    --scrim: rgba(39, 51, 95, .45);
    --on-accent: #27335F;
    --error: #C2255C;

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151C3A;
      --halo: #1D2750;
      --ink: #EAF1FF;
      --ink-soft: #A2ADDA;
      --shadow: #090D22;
      --water: #5AB0F2;
      --water-deep: #3684D6;
      --glass: #28336A;
      --gloss: rgba(255, 255, 255, .2);
      --card: #222C58;
      --field: #151C3A;
      --scrim: rgba(5, 8, 24, .65);
      --error: #FF9DBB;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151C3A;
    --halo: #1D2750;
    --ink: #EAF1FF;
    --ink-soft: #A2ADDA;
    --shadow: #090D22;
    --water: #5AB0F2;
    --water-deep: #3684D6;
    --glass: #28336A;
    --gloss: rgba(255, 255, 255, .2);
    --card: #222C58;
    --field: #151C3A;
    --scrim: rgba(5, 8, 24, .65);
    --error: #FF9DBB;
  }

  html, body { height: 100%; margin: 0; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Grandstander", ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold", system-ui, sans-serif;
    font-weight: 500;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  button {
    font: inherit;
    color: inherit;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  ::selection { background: var(--pink); color: var(--on-accent); }
  :focus-visible { outline: 3px solid var(--water-deep); outline-offset: 3px; }

  .app {
    height: 100%;
    max-width: 440px;
    margin: 0 auto;
    padding: 14px 20px 18px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    position: relative;
    z-index: 1;
    margin: 0;
    font-size: 1.3rem;
    font-weight: 800;
    letter-spacing: .01em;
  }

  /* bottle */
  .stage {
    position: relative;
    flex: 1;
    min-height: 0;
    width: 100%;
    margin: 8px 0 4px;
  }
  .stage::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(100%, 370px);
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: var(--halo);
  }
  .bottle-wrap {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transform-origin: 50% 90%;
  }
  .bottle-wrap svg {
    display: block;
    height: 100%;
    width: auto;
    max-width: 100%;
    max-height: 470px;
    overflow: visible;
  }
  #level { transition: transform .95s cubic-bezier(.3, 1.3, .5, 1); }
  .wave-front { animation: drift 3.2s linear infinite; }
  .wave-back { animation: drift 5.2s linear infinite reverse; }
  @keyframes drift { to { transform: translateX(-120px); } }

  .eyes-open {
    transform-box: fill-box;
    transform-origin: center;
    animation: blink 5.5s infinite;
  }
  @keyframes blink {
    0%, 94%, 100% { transform: scaleY(1); }
    96.5% { transform: scaleY(.1); }
  }
  .mood, .eyes-joy { display: none; }
  [data-mood="thirsty"] .m-thirsty,
  [data-mood="sip"] .m-sip,
  [data-mood="happy"] .m-happy,
  [data-mood="joy"] .m-joy,
  [data-mood="joy"] .eyes-joy { display: inline; }
  [data-mood="joy"] .eyes-open { display: none; }

  .goal-heart .h { fill: var(--glass); transform-box: fill-box; transform-origin: center; transition: fill .4s; }
  [data-mood="joy"] .goal-heart .h { fill: var(--pink); animation: beat 1.1s ease-in-out infinite; }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    18% { transform: scale(1.28); }
    36% { transform: scale(1); }
    54% { transform: scale(1.18); }
  }

  .bottle-wrap.gulp { animation: gulp .5s ease; }
  @keyframes gulp { 40% { transform: scale(1.045, .955); } }
  .bottle-wrap.hop { animation: hop 1s cubic-bezier(.3, .6, .4, 1) 2; }
  @keyframes hop {
    0%, 100% { transform: translateY(0) rotate(0); }
    18% { transform: translateY(5px) scale(1.05, .94); }
    45% { transform: translateY(-28px) rotate(-6deg); }
    62% { transform: translateY(-28px) rotate(6deg); }
    84% { transform: translateY(4px) scale(1.03, .97); }
  }

  /* numbers */
  .readout {
    position: relative;
    z-index: 1;
    text-align: center;
  }
  .amount {
    margin: 0;
    font-weight: 800;
    font-size: clamp(2.5rem, 12vw, 3.25rem);
    line-height: 1;
  }
  .amount .of {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--ink-soft);
  }
  .status {
    margin: 8px 0 0;
    min-height: 1.4em;
    font-size: 1.05rem;
    line-height: 1.4;
  }
  .status.pop { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes pop {
    0% { transform: scale(.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* buttons */
  .controls {
    position: relative;
    z-index: 1;
    width: 100%;
    margin-top: 16px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
  }
  .pill {
    min-height: 48px;
    padding: 0 14px;
    white-space: nowrap;
    border: 2.5px solid var(--ink);
    border-radius: 999px;
    background: var(--card);
    font-weight: 700;
    font-size: 1rem;
    box-shadow: 0 3px 0 var(--shadow);
    transition: transform .08s, box-shadow .08s;
  }
  .pill:active { transform: translateY(3px); box-shadow: 0 0 0 var(--shadow); }
  #resetBtn { justify-self: start; }
  #goalBtn { justify-self: end; }
  .plus {
    width: 82px;
    height: 82px;
    padding: 0;
    border: 3px solid var(--ink);
    border-radius: 50%;
    background: var(--pink);
    color: var(--on-accent);
    box-shadow: 0 5px 0 var(--shadow);
    display: grid;
    place-items: center;
    transition: transform .08s, box-shadow .08s;
  }
  .plus:active { transform: translateY(5px); box-shadow: 0 0 0 var(--shadow); }
  .plus svg { width: 34px; height: 34px; }

  /* sheet */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    box-sizing: border-box;
    padding: calc(env(safe-area-inset-top, 0px) + 9vh) 16px 16px;
    background: var(--scrim);
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .overlay[hidden] { display: none; }
  .card {
    width: 100%;
    max-width: 360px;
    box-sizing: border-box;
    padding: 22px 20px 12px;
    background: var(--card);
    border: 3px solid var(--ink);
    border-radius: 28px;
    box-shadow: 0 6px 0 var(--shadow);
    animation: card-in .28s cubic-bezier(.3, 1.4, .5, 1);
  }
  @keyframes card-in {
    0% { transform: translateY(14px) scale(.94); opacity: 0; }
    100% { transform: none; opacity: 1; }
  }
  .card h2 { margin: 0; font-size: 1.45rem; font-weight: 800; }
  .card .hint { margin: 6px 0 0; color: var(--ink-soft); font-size: 1rem; line-height: 1.4; }
  .field {
    margin-top: 16px;
    padding: 8px 16px;
    display: flex;
    align-items: baseline;
    gap: 8px;
    background: var(--field);
    border: 2.5px solid var(--ink);
    border-radius: 18px;
  }
  .field:focus-within { box-shadow: 0 0 0 4px var(--pink); }
  .field input {
    flex: 1;
    min-width: 0;
    padding: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 2rem;
    font-weight: 800;
    border-radius: 0;
    -webkit-appearance: none;
    appearance: none;
  }
  .field input::placeholder { color: var(--ink-soft); opacity: .5; }
  .field .unit { font-size: 1.3rem; font-weight: 800; color: var(--ink-soft); }
  .chips { margin-top: 12px; display: flex; gap: 8px; }
  .chips[hidden], .field[hidden] { display: none; }
  .chip {
    flex: 1;
    min-height: 44px;
    padding: 4px 6px;
    border: 2px solid var(--ink);
    border-radius: 14px;
    background: transparent;
    font-size: .92rem;
    font-weight: 700;
    line-height: 1.2;
  }
  .chip span { display: block; font-weight: 500; color: var(--ink-soft); font-size: .85rem; }
  .chip:active { background: var(--field); }
  .error { margin: 10px 0 0; min-height: 1.3em; color: var(--error); font-size: .95rem; font-weight: 700; }
  .primary {
    width: 100%;
    min-height: 56px;
    margin-top: 6px;
    border: 3px solid var(--ink);
    border-radius: 999px;
    background: var(--pink);
    color: var(--on-accent);
    font-size: 1.15rem;
    font-weight: 800;
    box-shadow: 0 4px 0 var(--shadow);
    transition: transform .08s, box-shadow .08s;
  }
  .primary:active { transform: translateY(4px); box-shadow: 0 0 0 var(--shadow); }
  .quiet {
    width: 100%;
    min-height: 48px;
    margin-top: 6px;
    border: 0;
    background: transparent;
    color: var(--ink-soft);
    font-size: 1rem;
    font-weight: 700;
  }

  .save-note {
    position: relative;
    z-index: 1;
    margin: 10px 0 0;
    min-height: 1.3em;
    font-size: .8rem;
    line-height: 1.3;
    color: var(--ink-soft);
    text-align: center;
  }

  /* party */
  .party { position: fixed; inset: 0; z-index: 20; pointer-events: none; overflow: hidden; }
  .bit { position: absolute; display: block; }
  .bit svg { display: block; width: 100%; height: 100%; overflow: visible; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main class="app">
  <h1>Little sips</h1>

  <div class="stage">
    <div class="bottle-wrap" id="bottleWrap">
      <svg id="bottle" viewBox="0 0 240 364" role="img" aria-label="Water bottle, empty" data-mood="thirsty">
        <defs>
          <clipPath id="inside">
            <path d="M92 62H148V84C148 100 200 104 200 150V300C200 328 180 344 150 344H90C60 344 40 328 40 300V150C40 104 92 100 92 84Z"/>
          </clipPath>
        </defs>

        <!-- carry loop -->
        <path d="M102 26C102 4 138 4 138 26" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>

        <!-- glass -->
        <path d="M92 62H148V84C148 100 200 104 200 150V300C200 328 180 344 150 344H90C60 344 40 328 40 300V150C40 104 92 100 92 84Z" fill="var(--glass)"/>

        <!-- water -->
        <g clip-path="url(#inside)">
          <g id="level" style="transform: translateY(370px)">
            <g class="wave-back">
              <path d="M-120 -4q30 -9 60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0V420H-120Z" fill="var(--water-deep)"/>
            </g>
            <g class="wave-front">
              <path d="M-120 2q30 7 60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0t60 0V420H-120Z" fill="var(--water)"/>
            </g>
            <circle cx="70" cy="34" r="4" fill="#fff" opacity=".5"/>
            <circle cx="82" cy="52" r="2.5" fill="#fff" opacity=".5"/>
            <circle cx="172" cy="44" r="3" fill="#fff" opacity=".4"/>
          </g>
          <path d="M58 156V268M58 290v6" fill="none" stroke="var(--gloss)" stroke-width="9" stroke-linecap="round"/>
        </g>

        <!-- quarter marks -->
        <path d="M184 288.5h10M184 233h10M184 177.5h10" fill="none" stroke="var(--ink)" stroke-opacity=".3" stroke-width="3.5" stroke-linecap="round"/>

        <!-- outline -->
        <path d="M92 62H148V84C148 100 200 104 200 150V300C200 328 180 344 150 344H90C60 344 40 328 40 300V150C40 104 92 100 92 84Z" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>

        <!-- cap -->
        <rect x="84" y="24" width="72" height="44" rx="13" fill="var(--pink)" stroke="var(--ink)" stroke-width="5"/>
        <path d="M98 38h20" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="5" stroke-linecap="round"/>

        <!-- face -->
        <g transform="translate(120 222) scale(1.22) translate(-120 -218)">
        <ellipse cx="80" cy="227" rx="10" ry="6" fill="var(--pink)" opacity=".95"/>
        <ellipse cx="160" cy="227" rx="10" ry="6" fill="var(--pink)" opacity=".95"/>
        <g class="eyes-open">
          <circle cx="97" cy="210" r="6" fill="var(--ink)"/>
          <circle cx="143" cy="210" r="6" fill="var(--ink)"/>
          <circle cx="95" cy="208" r="2" fill="var(--glass)"/>
          <circle cx="141" cy="208" r="2" fill="var(--glass)"/>
        </g>
        <g class="eyes-joy" fill="none" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round">
          <path d="M89 214q8 -11 16 0"/>
          <path d="M135 214q8 -11 16 0"/>
        </g>
        <g fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
          <path class="mood m-thirsty" d="M110 229q5 -5 10 0t10 0"/>
          <path class="mood m-sip" d="M111 224q9 8 18 0"/>
          <path class="mood m-happy" d="M106 222q14 15 28 0"/>
        </g>
        <g class="mood m-joy">
          <path d="M106 221h28c0 10-6 17-14 17s-14-7-14-17Z" fill="var(--ink)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
          <ellipse cx="120" cy="233.5" rx="6.5" ry="3.2" fill="var(--pink)"/>
        </g>
        <path class="mood m-thirsty" d="M168 176c4 6 6.5 9.5 6.5 12.5a6.5 6.5 0 0 1-13 0c0-3 2.5-6.5 6.5-12.5Z" fill="var(--water)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>
        </g>

        <!-- goal line -->
        <g class="goal-heart" transform="translate(218 122)">
          <path d="M-20 0h4" fill="none" stroke="var(--ink)" stroke-opacity=".4" stroke-width="3" stroke-linecap="round"/>
          <path class="h" d="M0 9C-14 -1 -9 -12 0 -4.5C9 -12 14 -1 0 9Z" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
        </g>
      </svg>
    </div>
  </div>

  <div class="readout">
    <p class="amount"><span id="total">0</span> <span class="of" id="of">of 2 L</span></p>
    <p class="status" id="status" aria-live="polite"></p>
  </div>

  <div class="controls">
    <button class="pill" id="resetBtn" type="button">Reset</button>
    <button class="plus" id="addBtn" type="button" aria-label="Add water">
      <svg viewBox="0 0 34 34" aria-hidden="true"><path d="M17 5v24M5 17h24" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/></svg>
    </button>
    <button class="pill" id="goalBtn" type="button">Goal 2 L</button>
  </div>
  <p class="save-note" id="saveNote" aria-live="polite"></p>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">Add water</h2>
    <p class="hint" id="sheetHint"></p>
    <div class="field" id="field">
      <input id="amount" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="0.25" aria-labelledby="sheetHint" maxlength="5">
      <span class="unit" aria-hidden="true">L</span>
    </div>
    <div class="chips" id="chips">
      <button class="chip" type="button" data-v="0.25">Glass<span>0.25 L</span></button>
      <button class="chip" type="button" data-v="0.35">Mug<span>0.35 L</span></button>
      <button class="chip" type="button" data-v="0.5">Bottle<span>0.5 L</span></button>
    </div>
    <p class="error" id="error" role="alert"></p>
    <button class="primary" id="primary" type="button">Add water</button>
    <button class="quiet" id="cancel" type="button">Cancel</button>
  </div>
</div>

<div class="party" id="party" aria-hidden="true"></div>

<script>
(function () {
  var KEY = 'little-sips';
  var Y_EMPTY = 370, Y_BOTTOM = 344, Y_FULL = 122;
  var state = { total: 0, goal: 2, t: 0 };

  function clean(raw) {
    if (!raw || typeof raw.total !== 'number' || typeof raw.goal !== 'number') return null;
    if (!isFinite(raw.total) || !isFinite(raw.goal) || raw.goal <= 0) return null;
    return {
      total: Math.min(Math.max(0, raw.total), 999),
      goal: Math.min(raw.goal, 10),
      t: typeof raw.t === 'number' && isFinite(raw.t) && raw.t > 0 ? raw.t : 0
    };
  }

  function keepLocal() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  try {
    var local = clean(JSON.parse(localStorage.getItem(KEY) || 'null'));
    if (local) state = local;
  } catch (e) {}
  var loadedT = state.t;

  /* Saving. iPhones wipe a framed page's browser storage when the browser closes,
     so the bottle is also kept in the viewer's own private spot in the page's
     database when they are signed in and allowed to write. Browser storage stays
     as the fallback. */
  var cloudDoc = null, synced = false, early = [], writing = false, dirty = false;

  function save() {
    state.t = Date.now();
    keepLocal();
    pushCloud();
  }

  function note(op) { if (!synced) early.push(op); }

  function redo(base, ops) {
    var next = { total: base.total, goal: base.goal, t: base.t };
    ops.forEach(function (op) {
      if (op.k === 'add') next.total = Math.round((next.total + op.v) * 1000) / 1000;
      else if (op.k === 'goal') next.goal = op.v;
      else if (op.k === 'reset') next.total = 0;
    });
    return next;
  }

  function showSaved(where) {
    var el = document.getElementById('saveNote');
    if (!el) return;
    var framed = true;
    try { framed = window.self !== window.top; } catch (e) {}
    el.textContent =
      where === 'cloud' ? 'Saved to your Claude account' :
      (framed && isIOS) ? 'Not saved after you close the app' :
      'Saved on this device';
  }

  function pushCloud(isRetry) {
    if (!cloudDoc) return;
    if (writing && !isRetry) { dirty = true; return; }
    writing = true;
    dirty = false;
    cloudDoc.set({ total: state.total, goal: state.goal, t: state.t }).then(function () {
      writing = false;
      showSaved('cloud');
      if (dirty) pushCloud();
    }, function (err) {
      var code = err && err.code;
      var final = code === 'invalid_argument' || code === 'revoked' || code === 'not_granted' ||
        code === 'quota_exceeded' || code === 'capability_disabled' ||
        code === 'capability_removed' || code === 'transform_error';
      if (!final && !isRetry) {
        setTimeout(function () { pushCloud(true); }, 500 + Math.random() * 900);
        return;
      }
      writing = false;
      if (final) cloudDoc = null;
      showSaved('device');
    });
  }

  function noCloud() {
    synced = true;
    early = [];
    showSaved('device');
  }

  function startCloud() {
    var c = window.claude;
    if (!c || typeof c.use !== 'function') { noCloud(); return; }
    Promise.all([c.use('db'), c.use('user')]).then(function (got) {
      var db = got[0], user = got[1];
      if (!db || !user) { noCloud(); return; }
      return user.id().then(function (uid) {
        if (!uid) { noCloud(); return; }
        var doc = db.doc('data/users/' + uid + '/bottle');
        return doc.get().then(function (snap) {
          var remote = snap && snap.exists ? clean(snap.data()) : null;
          var push;
          if (remote && remote.t >= loadedT) {
            push = early.length > 0;
            state = redo(remote, early);
            if (push) state.t = Date.now();
          } else {
            push = state.t > 0;
          }
          cloudDoc = doc;
          synced = true;
          early = [];
          keepLocal();
          render();
          if (push) pushCloud();
          else if (remote) showSaved('cloud');
        });
      });
    }).catch(noCloud);
  }

  var $ = function (id) { return document.getElementById(id); };
  var bottle = $('bottle'), wrap = $('bottleWrap'), level = $('level');
  var totalEl = $('total'), ofEl = $('of'), statusEl = $('status');
  var goalBtn = $('goalBtn'), overlay = $('overlay'), field = $('field');
  var input = $('amount'), chips = $('chips'), errorEl = $('error');
  var primary = $('primary'), cancel = $('cancel'), party = $('party');
  var reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function fmt(n) { return String(Math.round(n * 100) / 100); }
  function reached() { return state.total >= state.goal - 0.0005; }

  function render() {
    var p = Math.min(state.total / state.goal, 1);
    var y = state.total <= 0 ? Y_EMPTY : Y_BOTTOM - p * (Y_BOTTOM - Y_FULL);
    level.style.transform = 'translateY(' + y + 'px)';

    var mood = state.total <= 0 ? 'thirsty' : reached() ? 'joy' : p < 0.5 ? 'sip' : 'happy';
    bottle.setAttribute('data-mood', mood);
    bottle.setAttribute('aria-label', 'Water bottle, ' + Math.round(p * 100) + ' percent full');

    totalEl.textContent = fmt(state.total);
    ofEl.textContent = 'of ' + fmt(state.goal) + ' L';
    goalBtn.textContent = 'Goal ' + fmt(state.goal) + ' L';

    var left = fmt(Math.max(state.goal - state.total, 0.01));
    statusEl.textContent =
      mood === 'thirsty' ? 'Tap + and fill me up to the heart.' :
      mood === 'sip' ? 'Good start! ' + left + ' L to go.' :
      mood === 'happy' ? 'Over halfway! ' + left + ' L to go.' :
      'Goal reached! So proud of you Nouri!';
  }

  /* sounds, made in the browser so there are no audio files to load */
  var actx = null;
  function audio() {
    try {
      if (!actx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        actx = new AC();
      }
      if (actx.state !== 'running' && actx.resume) actx.resume();
      return actx;
    } catch (e) { return null; }
  }

  /* iPhone: web sounds are muted by the silent switch and stay locked until a tap.
     wake() runs inside a tap, moves sound to the media channel and unlocks it. */
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var hush = null;

  function silentClip() {
    var rate = 8000, n = rate * 4, bytes = new Uint8Array(44 + n), dv = new DataView(bytes.buffer);
    function put(at, text) { for (var i = 0; i < text.length; i++) bytes[at + i] = text.charCodeAt(i); }
    put(0, 'RIFF'); dv.setUint32(4, 36 + n, true); put(8, 'WAVE'); put(12, 'fmt ');
    dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
    dv.setUint32(24, rate, true); dv.setUint32(28, rate, true);
    dv.setUint16(32, 1, true); dv.setUint16(34, 8, true);
    put(36, 'data'); dv.setUint32(40, n, true);
    for (var i = 44; i < bytes.length; i++) bytes[i] = 128;
    return URL.createObjectURL(new Blob([bytes], { type: 'audio/wav' }));
  }

  function wake() {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    if (isIOS) {
      try {
        if (!hush) {
          hush = new Audio(silentClip());
          hush.setAttribute('playsinline', '');
          hush.preload = 'auto';
        }
        try { hush.currentTime = 0; } catch (e) {}
        var started = hush.play();
        if (started && started.catch) started.catch(function () {});
      } catch (e) {}
    }
    var c = audio();
    if (c) {
      try {
        var src = c.createBufferSource();
        src.buffer = c.createBuffer(1, 1, 22050);
        src.connect(c.destination);
        src.start(0);
      } catch (e) {}
    }
    return c;
  }

  function drip(c, t, from, to, vol) {
    var o = c.createOscillator(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(from, t);
    o.frequency.exponentialRampToValueAtTime(to, t + 0.075);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.21);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + 0.24);
  }

  function bell(c, t, freq, vol, dur) {
    [[1, 1], [2, 0.28], [3, 0.1]].forEach(function (part) {
      var o = c.createOscillator(), g = c.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(freq * part[0], t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol * part[1], t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur / part[0]);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + dur + 0.05);
    });
  }

  function playAdd() {
    var c = wake();
    if (!c) return;
    try {
      var t = c.currentTime + 0.03;
      drip(c, t, 380, 980, 0.3);
      drip(c, t + 0.12, 520, 1320, 0.24);
      drip(c, t + 0.22, 700, 1720, 0.15);
    } catch (e) {}
  }

  function playGoal() {
    var c = audio();
    if (!c) return;
    try {
      var t = c.currentTime + 0.03;
      [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) {
        bell(c, t + i * 0.11, f, 0.2, 0.7);
      });
      bell(c, t + 0.52, 1318.51, 0.16, 1.3);
      bell(c, t + 0.52, 1567.98, 0.12, 1.3);
      bell(c, t + 0.74, 2093, 0.07, 1.1);
    } catch (e) {}
  }

  /* sheet */
  var mode = null, opener = null;

  function openSheet(m) {
    mode = m;
    opener = document.activeElement;
    errorEl.textContent = '';
    field.hidden = m === 'reset';
    chips.hidden = m !== 'add';
    if (m === 'add') {
      $('sheetTitle').textContent = 'Add water';
      $('sheetHint').textContent = 'How much did you drink, in liters?';
      primary.textContent = 'Add water';
      cancel.textContent = 'Cancel';
      input.placeholder = '0.25';
      input.value = '';
    } else if (m === 'goal') {
      $('sheetTitle').textContent = 'Daily goal';
      $('sheetHint').textContent = 'How many liters do you want to drink a day?';
      primary.textContent = 'Save goal';
      cancel.textContent = 'Cancel';
      input.placeholder = '2';
      input.value = fmt(state.goal);
    } else {
      $('sheetTitle').textContent = 'Reset the bottle?';
      $('sheetHint').textContent = 'This empties the bottle. Your goal stays the same.';
      primary.textContent = 'Reset bottle';
      cancel.textContent = 'Keep it';
    }
    overlay.hidden = false;
    if (m === 'reset') {
      primary.focus();
    } else {
      input.focus();
      try { input.setSelectionRange(0, input.value.length); } catch (e) {}
    }
  }

  function closeSheet() {
    overlay.hidden = true;
    input.blur();
    mode = null;
    if (opener && opener.focus) { try { opener.focus({ preventScroll: true }); } catch (e) {} }
  }

  function submit() {
    if (mode === 'reset') {
      state.total = 0;
      note({ k: 'reset' });
      save();
      closeSheet();
      render();
      return;
    }
    var raw = input.value.trim().replace(',', '.');
    var v = raw === '' ? NaN : Number(raw);

    if (mode === 'add') {
      if (!isFinite(v) || v <= 0) { errorEl.textContent = 'Enter an amount in liters, like 0.25.'; return; }
      if (v > 5) { errorEl.textContent = 'Enter 5 L or less at a time.'; return; }
      var wasReached = reached();
      state.total = Math.round((state.total + v) * 1000) / 1000;
      note({ k: 'add', v: v });
      save();
      closeSheet();
      render();
      playAdd();
      if (!wasReached && reached()) {
        setTimeout(celebrate, reduceMotion ? 0 : 900);
      } else {
        replay(wrap, 'gulp');
      }
    } else if (mode === 'goal') {
      if (!isFinite(v) || v <= 0) { errorEl.textContent = 'Enter a goal in liters, like 2.'; return; }
      if (v > 10) { errorEl.textContent = 'Pick a goal of 10 L or less.'; return; }
      state.goal = Math.round(v * 100) / 100;
      note({ k: 'goal', v: state.goal });
      save();
      closeSheet();
      render();
    }
  }

  function replay(el, cls) {
    el.classList.remove('gulp', 'hop', 'pop');
    void el.offsetWidth;
    el.classList.add(cls);
  }
  wrap.addEventListener('animationend', function (e) {
    if (e.target === wrap) wrap.classList.remove('gulp', 'hop');
  });

  /* goal party */
  var SHAPES = [
    { d: 'M0 9C-14 -1 -9 -12 0 -4.5C9 -12 14 -1 0 9Z', fill: 'var(--pink)' },
    { d: 'M0 9C-14 -1 -9 -12 0 -4.5C9 -12 14 -1 0 9Z', fill: 'var(--pink)' },
    { d: 'M0 -11C6 -3 8.5 1 8.5 4.5A8.5 8.5 0 0 1 -8.5 4.5C-8.5 1 -6 -3 0 -11Z', fill: 'var(--water)' },
    { d: 'M0 -12Q1.8 -1.8 12 0Q1.8 1.8 0 12Q-1.8 1.8 -12 0Q-1.8 -1.8 0 -12Z', fill: 'var(--butter)' }
  ];

  function burst(count) {
    var r = bottle.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height * 0.42;
    for (var i = 0; i < count; i++) {
      var s = SHAPES[Math.floor(Math.random() * SHAPES.length)];
      var size = 22 + Math.random() * 24;
      var el = document.createElement('span');
      el.className = 'bit';
      el.style.left = cx + 'px';
      el.style.top = cy + 'px';
      el.style.width = el.style.height = size + 'px';
      el.innerHTML = '<svg viewBox="-14 -14 28 28"><path d="' + s.d + '" fill="' + s.fill +
        '" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/></svg>';
      party.appendChild(el);

      var angle = (-90 + (Math.random() * 170 - 85)) * Math.PI / 180;
      var dist = 130 + Math.random() * 230;
      var dx = Math.cos(angle) * dist, dy = Math.sin(angle) * dist - 40;
      var rot = Math.random() * 140 - 70;
      var base = 'translate(-50%, -50%) ';
      if (!el.animate) { el.remove(); continue; }
      var anim = el.animate([
        { transform: base + 'translate(0px, 0px) scale(.2) rotate(0deg)', opacity: 0 },
        { transform: base + 'translate(' + dx * .8 + 'px,' + dy * .8 + 'px) scale(1.1) rotate(' + rot * .7 + 'deg)', opacity: 1, offset: .35 },
        { transform: base + 'translate(' + dx + 'px,' + dy + 'px) scale(1) rotate(' + rot + 'deg)', opacity: 1, offset: .7 },
        { transform: base + 'translate(' + dx * 1.05 + 'px,' + (dy + 70) + 'px) scale(.7) rotate(' + rot * 1.3 + 'deg)', opacity: 0 }
      ], { duration: 1700 + Math.random() * 900, delay: Math.random() * 250, easing: 'cubic-bezier(.2, .7, .3, 1)', fill: 'both' });
      anim.onfinish = (function (node) { return function () { node.remove(); }; })(el);
    }
  }

  function celebrate() {
    replay(statusEl, 'pop');
    playGoal();
    if (reduceMotion) return;
    replay(wrap, 'hop');
    burst(18);
    setTimeout(function () { burst(14); }, 550);
    setTimeout(function () { burst(14); }, 1100);
  }

  /* wiring */
  $('addBtn').addEventListener('click', function () { wake(); openSheet('add'); });
  $('goalBtn').addEventListener('click', function () { openSheet('goal'); });
  $('resetBtn').addEventListener('click', function () { openSheet('reset'); });
  primary.addEventListener('click', submit);
  cancel.addEventListener('click', closeSheet);
  overlay.addEventListener('click', function (e) { if (e.target === overlay) closeSheet(); });
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
  input.addEventListener('input', function () { errorEl.textContent = ''; });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !overlay.hidden) closeSheet(); });
  chips.addEventListener('click', function (e) {
    var chip = e.target.closest ? e.target.closest('.chip') : null;
    if (!chip) return;
    input.value = chip.getAttribute('data-v');
    errorEl.textContent = '';
  });

  /* first paint: start empty, then let the water rise to the saved level */
  void level.getBoundingClientRect();
  render();
  startCloud();
})();
</script>
</body>
</html>
